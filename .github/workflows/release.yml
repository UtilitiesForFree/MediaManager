name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build — ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:

          # ── macOS universal (Apple Silicon + Intel fat binary) ──────────
          - name: macOS (universal)
            os: macos-latest
            args: --target universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin

          # ── Linux x86-64 ────────────────────────────────────────────────
          - name: Linux (x86-64)
            os: ubuntu-22.04
            args: ''
            rust_targets: x86_64-unknown-linux-gnu

          # ── Windows x86-64 ──────────────────────────────────────────────
          - name: Windows (x86-64)
            os: windows-latest
            args: ''
            rust_targets: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # ── Linux system dependencies ────────────────────────────────────────
      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl wget file \
            libxdo-dev \
            libssl-dev \
            pkg-config \
            libayatana-appindicator3-dev \
            librsvg2-dev

      # ── JS dependencies ──────────────────────────────────────────────────
      - name: Install JS dependencies
        run: npm ci

      # ── Determine tag name ───────────────────────────────────────────────
      - name: Resolve tag name
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      # ── Build + upload to GitHub release ─────────────────────────────────
      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS code signing — set these secrets in repo settings to enable
          APPLE_CERTIFICATE:            ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD:   ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY:       ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID:                     ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD:               ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID:                ${{ secrets.APPLE_TEAM_ID }}
          # Windows code signing — set TAURI_PRIVATE_KEY + TAURI_KEY_PASSWORD
          TAURI_PRIVATE_KEY:            ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD:           ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          tagName:       ${{ steps.tag.outputs.name }}
          releaseName:   'MediaManager ${{ steps.tag.outputs.name }}'
          releaseBody: |
            ## What's new

            See the [full changelog](https://github.com/UtilitiesForFree/MediaManager/blob/main/CHANGELOG.md).

            ## Downloads

            | Platform | File |
            |---|---|
            | macOS (Apple Silicon + Intel) | `MediaManager_*_universal.dmg` |
            | Windows 10/11 x64 | `MediaManager_*_x64-setup.exe` |
            | Linux x64 (Debian/Ubuntu) | `mediamanager_*_amd64.deb` |
            | Linux x64 (AppImage) | `MediaManager_*_amd64.AppImage` |

            ## Installation notes

            **macOS:** If you see _"MediaManager is damaged"_, run:
            ```
            xattr -cr /Applications/MediaManager.app
            ```
            This is a Gatekeeper restriction for unsigned binaries. We recommend
            building from source or waiting for a signed release.

            **Windows:** SmartScreen may flag the unsigned installer. Click
            _More info → Run anyway_ to proceed.

            **Linux:** Make the AppImage executable before running:
            ```
            chmod +x MediaManager_*.AppImage && ./MediaManager_*.AppImage
            ```
          releaseDraft: false
          prerelease:   false
          args:         ${{ matrix.args }}
